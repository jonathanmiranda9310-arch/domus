name: domus
description: "Domus - busque, compare e reserve hospedagens em poucos toques."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:     # textos do Material (datas, botões) em pt_BR
    sdk: flutter
  sqflite: ^2.4.6            # banco SQLite local
  path: ^1.9.1               # monta o caminho do arquivo do banco
  shared_preferences: ^2.5.6 # sessão do usuário logado
  crypto: ^3.0.8             # hash SHA-256 da senha
  intl: ^0.20.2              # formatação de moeda e datas (pt_BR)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/data/acomodacoes.json
    - assets/images/
